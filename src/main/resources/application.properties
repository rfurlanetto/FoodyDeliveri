spring.datasource.url=jdbc:sqlite:rastreador.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret & Expiration (24h)
api.security.token.secret=chave-super-secreta-para-assinatura-jwt-123456

# Intervalo de verificação da automação (em milissegundos)
app.scheduler.status-interval-ms=20000
